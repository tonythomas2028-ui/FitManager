services:
  - type: web
    name: fitmanager
    runtime: python
    buildCommand: pip install -r requirements.txt
startCommand: flask --app app init-db && gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
