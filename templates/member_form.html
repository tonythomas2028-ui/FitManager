{% extends "base.html" %}{% block title %}Add member{% endblock %}{% block content %}<div class="heading"><div><p class="eyebrow">MEMBER MANAGEMENT</p><h1>Add a member</h1><p class="muted">Create a profile and set membership dates.</p></div><a class="btn secondary" href="{{ url_for('members') }}">← Back</a></div><form method="post" class="panel formpanel"><h3>Personal information</h3><div class="formgrid"><label>Full name *<input name="name" required value="{{ request.form.get('name','') }}" placeholder="e.g. Ananya Thomas"></label><label>Phone number *<input name="phone" required value="{{ request.form.get('phone','') }}" placeholder="9876543210"></label><label>Email address<input name="email" type="email" value="{{ request.form.get('email','') }}" placeholder="member@example.com"></label><label>Membership plan<select name="plan"><option>Monthly</option><option>Quarterly</option><option>Half-yearly</option><option>Yearly</option><option>Custom</option></select></label><label>Start date *<input type="date" name="start_date" required value="{{ request.form.get('start_date',start_default) }}"></label><label>End date *<input type="date" name="end_date" required value="{{ request.form.get('end_date',end_default) }}"></label></div><div class="actions"><a class="btn secondary" href="{{ url_for('members') }}">Cancel</a><button class="btn primary">Save member →</button></div></form>{% endblock %}
